<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>خوش اومدی نیلوفر</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Vazirmatn", sans-serif;
      background:
        linear-gradient(rgba(0, 15, 25, 0.16), rgba(0, 15, 25, 0.16)),
        url("801C359D-7508-4B42-A0EF-754424692A7E.png") center center / cover no-repeat fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 18px;
      color: #ffffff;
    }

    .card {
      width: 100%;
      max-width: 470px;
      min-height: 72vh;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;

      padding: 38px 28px;

      background: rgba(0, 25, 35, 0.28);

      border: 1px solid rgba(103, 246, 255, 0.6);

      border-radius: 34px;

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      box-shadow:
        0 0 30px rgba(0, 236, 255, 0.18),
        inset 0 0 35px rgba(0, 236, 255, 0.08);
    }

    .title {
      font-family: "Lalezar", sans-serif;
      font-size: clamp(38px, 10vw, 60px);
      line-height: 1.25;
      margin-bottom: 10px;

      color: #f8ffff;

      text-shadow:
        0 0 10px rgba(0, 255, 255, 0.28),
        0 0 22px rgba(0, 255, 255, 0.12);
    }

    .name {
      color: #64f7ff;
    }

    .dna {
      font-size: 38px;
      margin: 8px 0 24px;
      filter: drop-shadow(0 0 10px rgba(80, 240, 255, 0.65));
    }

    .main-text {
      font-size: 20px;
      line-height: 2;
      font-weight: 500;
      margin-bottom: 26px;
    }

    .mardin {
      color: #62f6ff;
      font-weight: 700;
      text-shadow: 0 0 9px rgba(98, 246, 255, 0.35);
    }

    .note {
      width: 100%;
      padding: 24px 18px;

      border-radius: 25px;

      background: rgba(0, 21, 31, 0.38);

      border: 1px solid rgba(101, 245, 255, 0.4);

      box-shadow:
        inset 0 0 26px rgba(0, 220, 255, 0.05),
        0 0 20px rgba(0, 220, 255, 0.07);

      margin-bottom: 28px;
    }

    .note-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .note-title {
      font-family: "Lalezar", sans-serif;
      font-size: 26px;
      color: #64f7ff;
      margin-bottom: 12px;
    }

    .note-text {
      font-size: 18px;
      line-height: 2;
    }

    .once {
      color: #62f6ff;
      font-weight: 800;
    }

    .start-btn {
      width: 100%;

      border: 1px solid #5ef7ff;

      border-radius: 999px;

      padding: 18px 24px;

      font-family: "Lalezar", sans-serif;
      font-size: 30px;

      color: white;

      background: rgba(0, 43, 54, 0.72);

      box-shadow:
        0 0 16px rgba(79, 244, 255, 0.65),
        inset 0 0 18px rgba(79, 244, 255, 0.12);

      cursor: pointer;

      transition: 0.25s ease;
    }

    .start-btn:active {
      transform: scale(0.97);
      box-shadow:
        0 0 8px rgba(79, 244, 255, 0.45);
    }

    @media (max-width: 480px) {
      body {
        padding: 18px 14px;
      }

      .card {
        padding: 30px 20px;
        min-height: 78vh;
      }

      .main-text {
        font-size: 18px;
      }

      .note-text {
        font-size: 17px;
      }

      .start-btn {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <h1 class="title">
      خوش اومدی <span class="name">نیلوفر</span>
    </h1>

    <div class="dna">🧬</div>

    <div class="main-text">
      اینجا کاملاً هدفمند انتخاب شدی
      <br>
      تا یه دیت عاشقانه و تکرارنشدنی رو
      <br>
      با <span class="mardin">ماردین</span> تجربه کنی. 🤍
    </div>

    <section class="note">

      <div class="note-icon">🧪</div>

      <div class="note-title">
        یه نکته مهم...
      </div>

      <div class="note-text">
        راستی یادت نره؛
        <br>
        این لینک فقط <span class="once">یکبار</span> اعتبار داره،
        <br>
        پس دقت کن که انتخابت درست باشه 🫠
      </div>

    </section>

    <button class="start-btn" onclick="startExperiment()">
      شروع کنیم 🧪
    </button>

  </main>

  <script>
    function startExperiment() {
      alert("مرحله بعدی به‌زودی اینجا قرار می‌گیره 🧬");
    }
  </script>

</body>
</html>
